<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#070812"
    />

    <meta
      name="description"
      content="Moonove — a growing creative ecosystem bringing together entertainment, visual storytelling and learning through distinct digital brands."
    />

    <title>Moonove — Creative Collective</title>
  </head>

  <body>

    <!-- =====================================================
         NETLIFY STATIC FORM: MOONLIT VISUAL
    ====================================================== -->

    <form
      name="moonlit-contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input
        type="hidden"
        name="form-name"
        value="moonlit-contact"
      />

      <input
        type="text"
        name="name"
      />

      <input
        type="email"
        name="email"
      />

      <input
        type="text"
        name="brand"
      />

      <input
        type="text"
        name="subject"
      />

      <textarea name="message"></textarea>

      <input
        type="text"
        name="bot-field"
      />
    </form>
