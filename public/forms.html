<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonove Forms</title>
  <style>
    /* Visually hides honeypot spam-prevention field from human users */
    .hidden-field {
      display: none;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <section aria-labelledby="moonlit-heading">
    <h2 id="moonlit-heading">Moonlit Visual</h2>
    <form
      name="moonlit-contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="moonlit-contact">

      <p class="hidden-field">
        <label>Don't fill this out if you're human: <input name="bot-field"></label>
      </p>

      <p>
        <label for="moonlit-name">Name:</label><br>
        <input type="text" id="moonlit-name" name="name" required>
      </p>

      <p>
        <label for="moonlit-email">Email:</label><br>
        <input type="email" id="moonlit-email" name="email" required>
      </p>

      <p>
        <label for="moonlit-brand">Brand:</label><br>
        <input type="text" id="moonlit-brand" name="brand">
      </p>

      <p>
        <label for="moonlit-subject">Subject:</label><br>
        <input type="text" id="moonlit-subject" name="subject" required>
      </p>

      <p>
        <label for="moonlit-message">Message:</label><br>
        <textarea id="moonlit-message" name="message" rows="5" required></textarea>
      </p>

      <p>
        <button type="submit">Send Message</button>
      </p>
    </form>
  </section>

  <hr>
